# The tap carries no package manifest — the formula is generated by the
# Stage-Utility release workflow — so the only thing here to keep current is the
# actions used by the secret scan.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
